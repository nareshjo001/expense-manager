name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 7

  backend-unit:
    name: Backend unit validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-integration:
    name: Backend integration validation
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_backend_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_JWT_SECRET: ci-test-secret-not-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration
      # DAT-003-T07 -- exercise the real migration driver against this
      # job's own throwaway CI Mongo container, end to end: dry-run first
      # (no writes), then a real apply (ledger + lock + the first real
      # migration's up()/verify() against real MongoDB, not a fake). This
      # is the one place in this repo's pipeline that runs migrations
      # against an actual database rather than a mock -- everything else
      # DAT-003 built was verified with fakes. --allow-no-backup-check is
      # legitimate here specifically because this Mongo container is
      # destroyed at the end of every CI run; never pass that flag against
      # a real deployment target.
      #
      # REDIS_URL is set explicitly here (config/redis.js reads exactly
      # this var name) -- the actual fix for the "Could not acquire the
      # migration lock: Redis is unreachable (The client is closed)"
      # failure was migrations/run.js never calling connectRedis() before
      # the lock code used the shared client (see that file's comment);
      # this is a defensive addition alongside that fix, not a
      # replacement for it.
      - name: Migrations dry-run (CI ephemeral Mongo)
        env:
          MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_backend_migrations_ci
          REDIS_URL: redis://127.0.0.1:6379
          MIGRATIONS_ENV_CONFIRMED: "true"
        run: node migrations/run.js --dry-run
      - name: Migrations apply (CI ephemeral Mongo)
        env:
          MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_backend_migrations_ci
          REDIS_URL: redis://127.0.0.1:6379
          MIGRATIONS_ENV_CONFIRMED: "true"
        run: node migrations/run.js --allow-no-backup-check

  # TST-001-T05 -- core Playwright end-to-end user journeys (login,
  # add-expense, budget), run for real against this job's own throwaway
  # mongo/redis service containers plus the real backend and real CRA
  # frontend dev server -- see e2e/playwright.config.js and
  # docs/testing/TST-001-T05-e2e-setup.md. This job is this suite's first
  # real execution: it was authored and verified (installs, `playwright
  # test --list` enumerates all specs cleanly) in a sandbox with no way to
  # run a live browser or a live MongoDB, so nothing here has actually run
  # green yet outside of this workflow.
  e2e:
    name: End-to-end user journeys
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Same variable names as the real app reads (backend/config/db.js,
      # backend/config/redis.js, backend/Middlewares/Auth.js) -- not the
      # TEST_*-prefixed names backend-integration uses above, because those
      # are specific to backend/tests/setup/integrationEnv.js's own
      # allowlist/remapping, which this job's real `node server.js` process
      # never goes through.
      MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_e2e_ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-e2e-test-secret-not-for-production
      # Nothing listens here on purpose -- see playwright.config.js's
      # webServer env for why a fast-failing ML_ROUTE is fine for this
      # suite's journeys.
      ML_ROUTE: http://127.0.0.1:65535
      BREVO_API_KEY: ci-e2e-dummy-brevo-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      # This job spans three separate npm packages (backend, frontend,
      # e2e), unlike this workflow's other jobs which each stay inside one
      # `defaults.run.working-directory` for their whole job -- so each
      # step below sets its own working-directory instead.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e journeys
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  ml:
    name: ML validation
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ML_TEST_MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_ml_integration_test
      ML_TEST_MONGO_DB_NAME: expense_manager_ml_integration_test
      ML_OPERATIONS_TOKEN: ci-test-token-not-for-production
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m pytest tests/ -v

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # npm's classic `npm audit` CLI call hits registry.npmjs.org's
      # quick-audit endpoint (POST /-/npm/v1/security/audits/quick), which
      # is currently degraded/being retired server-side -- verified
      # directly (not assumed): the exact same command run by hand against
      # the real registry returned a mix of indefinite hangs and a
      # `502 Bad Gateway` on that endpoint. That request failure is also
      # what produces the "Invalid package tree, run npm install to
      # rebuild your package-lock.json" text in the failing job's log --
      # that message is npm's generic wording for the audit request
      # itself failing, not necessarily a diagnosis of the lockfile.
      # Checked directly: both backend/package-lock.json and
      # frontend/package-lock.json are already byte-identical to what
      # `npm install` produces locally (confirmed via checksum), so there
      # is no actual lockfile drift to fix here -- the registry endpoint
      # is the real and only cause. A short retry loop is the correct
      # mitigation for a flaky external dependency in a required CI gate:
      # it still fails the job (and therefore blocks the merge) on a real
      # finding at or above --audit-level, it just does not fail solely
      # because npmjs.org's audit endpoint dropped one or two requests.
      - name: Backend dependency audit
        working-directory: backend
        run: |
          attempt=1
          max_attempts=5
          until npm audit --omit=dev --audit-level=critical; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "npm audit failed after $max_attempts attempts."
              exit 1
            fi
            echo "npm audit attempt $attempt/$max_attempts failed (often a transient registry.npmjs.org audit-endpoint issue, not a real finding) -- retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done
      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          attempt=1
          max_attempts=5
          until npm audit --omit=dev --audit-level=critical; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "npm audit failed after $max_attempts attempts."
              exit 1
            fi
            echo "npm audit attempt $attempt/$max_attempts failed (often a transient registry.npmjs.org audit-endpoint issue, not a real finding) -- retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done
