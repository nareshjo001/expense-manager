name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # OPS-001-T06 -- blocking lint gate over application source, at zero
      # tolerance. Test files are linted in the informational step below:
      # `react-app/jest` enables testing-library rules that CRA's own build
      # never applies, and the existing suites predate them.
      - name: Lint (application source, blocking)
        run: npm run lint:ci
      - name: Lint (test files, informational)
        run: npm run lint
        continue-on-error: true
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 7

  backend-unit:
    name: Backend unit validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # OPS-001-T06 -- fails on any lint error, and on any rise in the
      # warning count above scripts/lint-baseline.json, so the warning
      # list can only shrink. See backend/eslint.config.js for why each
      # rule sits at error vs warn.
      - name: Lint
        run: npm run lint:ci
      - run: npm test

  backend-integration:
    name: Backend integration validation
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_backend_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_JWT_SECRET: ci-test-secret-not-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration
      # DAT-003-T07 -- exercise the real migration driver against this
      # job's own throwaway CI Mongo container, end to end: dry-run first
      # (no writes), then a real apply (ledger + lock + the first real
      # migration's up()/verify() against real MongoDB, not a fake). This
      # is the one place in this repo's pipeline that runs migrations
      # against an actual database rather than a mock -- everything else
      # DAT-003 built was verified with fakes. --allow-no-backup-check is
      # legitimate here specifically because this Mongo container is
      # destroyed at the end of every CI run; never pass that flag against
      # a real deployment target.
      #
      # REDIS_URL is set explicitly here (config/redis.js reads exactly
      # this var name) -- the actual fix for the "Could not acquire the
      # migration lock: Redis is unreachable (The client is closed)"
      # failure was migrations/run.js never calling connectRedis() before
      # the lock code used the shared client (see that file's comment);
      # this is a defensive addition alongside that fix, not a
      # replacement for it.
      - name: Migrations dry-run (CI ephemeral Mongo)
        env:
          MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_backend_migrations_ci
          REDIS_URL: redis://127.0.0.1:6379
          MIGRATIONS_ENV_CONFIRMED: "true"
        run: node migrations/run.js --dry-run
      - name: Migrations apply (CI ephemeral Mongo)
        env:
          MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_backend_migrations_ci
          REDIS_URL: redis://127.0.0.1:6379
          MIGRATIONS_ENV_CONFIRMED: "true"
        run: node migrations/run.js --allow-no-backup-check

  # TST-001-T05 -- core Playwright end-to-end user journeys (login,
  # add-expense, budget), run for real against this job's own throwaway
  # mongo/redis service containers plus the real backend and real CRA
  # frontend dev server -- see e2e/playwright.config.js and
  # docs/testing/TST-001-T05-e2e-setup.md. This job is this suite's first
  # real execution: it was authored and verified (installs, `playwright
  # test --list` enumerates all specs cleanly) in a sandbox with no way to
  # run a live browser or a live MongoDB, so nothing here has actually run
  # green yet outside of this workflow.
  e2e:
    name: End-to-end user journeys
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Same variable names as the real app reads (backend/config/db.js,
      # backend/config/redis.js, backend/Middlewares/Auth.js) -- not the
      # TEST_*-prefixed names backend-integration uses above, because those
      # are specific to backend/tests/setup/integrationEnv.js's own
      # allowlist/remapping, which this job's real `node server.js` process
      # never goes through.
      MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_e2e_ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-e2e-test-secret-not-for-production
      # OPS-004-T06 -- required, >=32 characters, and MUST differ from
      # JWT_SECRET. This job previously set only JWT_SECRET and relied on
      # session.service.js falling back to it for refresh sessions, which
      # means a leaked access token doubles as a valid refresh token. The
      # startup validator refuses that arrangement, so the E2E run now uses
      # the same two distinct secrets a real deployment does.
      REFRESH_TOKEN_SECRET: ci-e2e-refresh-secret-distinct-from-jwt-secret
      # Nothing listens here on purpose -- see playwright.config.js's
      # webServer env for why a fast-failing ML_ROUTE is fine for this
      # suite's journeys.
      ML_ROUTE: http://127.0.0.1:65535
      BREVO_API_KEY: ci-e2e-dummy-brevo-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      # This job spans three separate npm packages (backend, frontend,
      # e2e), unlike this workflow's other jobs which each stay inside one
      # `defaults.run.working-directory` for their whole job -- so each
      # step below sets its own working-directory instead.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e journeys
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        # CI-004: this step has failed the whole job on a transient
        # "403 Forbidden: Error from intermediary" from GitHub's artifact
        # storage backend even when every actual e2e test (the previous
        # step) passed -- a known GitHub Actions upload-artifact@v4
        # flake, not something this repo controls. continue-on-error
        # keeps that failure from blocking CI/merges; the step still
        # shows as failed in the run so a genuinely missing report is
        # still visible, it just doesn't fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # TST-001-T07 -- run the deployment smoke test against a REAL running
  # backend, on every push and PR.
  #
  # The script exists to be run against a deployment right after it ships,
  # which means the only time it would otherwise execute is during a deploy --
  # so a broken check would be discovered at exactly the moment it is being
  # relied on. Worse, its failure mode is silent: a check that can no longer
  # detect anything still prints PASS. Running it here every PR is what makes
  # a green smoke run mean something later.
  #
  # This is not a second copy of the e2e job. e2e drives a browser through
  # user journeys; this starts the backend the way the deploy target starts
  # it (`npm start`, real process, real env) and asserts the operational
  # contract -- health endpoints, auth enforcement, security headers,
  # correlation IDs -- which no journey test covers.
  deployment-smoke:
    name: Deployment smoke test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # NODE_ENV=production on purpose, unlike this workflow's other jobs.
      # The point of a deployment smoke test is to exercise the configuration
      # a deployment actually runs under, and production mode is where the
      # rules differ: config/env.js requires CORS_ALLOWED_ORIGINS and
      # REDIS_URL, httpSecurity.js turns on HSTS, and session cookies become
      # secure-only. Running this job in test mode would skip exactly the
      # branches most likely to be misconfigured on a real deploy.
      NODE_ENV: production
      PORT: "8082"
      MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_smoke_ci
      REDIS_URL: redis://127.0.0.1:6379
      CORS_ALLOWED_ORIGINS: https://smoke.example
      # Two distinct secrets, as config/env.js requires -- see
      # backend/tests/env.ciContract.test.js for why sharing one is a real
      # weakness and not just a rule.
      JWT_SECRET: ci-smoke-test-secret-not-for-production
      REFRESH_TOKEN_SECRET: ci-smoke-refresh-secret-distinct-from-jwt
      # PROCESS_ROLE is set so the smoke test's --expect-role assertion has
      # something to assert, and so this job does not schedule cron jobs it
      # has no reason to run.
      PROCESS_ROLE: web
      # Nothing listens here. The ML dependency is optional, so the smoke test
      # reports it as an advisory and the job still passes -- which is itself
      # worth exercising, since that pass-with-advisories path is the one a
      # real deploy most often takes.
      ML_ROUTE: http://127.0.0.1:65535
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Start the backend the way the deploy target starts it
        run: |
          npm start > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Wait for readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8082/health/ready > /dev/null 2>&1; then
              echo "Ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not become ready within 30s."
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Run the deployment smoke test
        run: node scripts/smokeTest.js --expect-role=web http://127.0.0.1:8082

      - name: Backend log
        if: always()
        run: cat "$RUNNER_TEMP/backend.log" || true

      - name: Stop the backend
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/backend.pid")" || true

  ml:
    name: ML validation
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ML_TEST_MONGO_CONN: mongodb://127.0.0.1:27017/expense_manager_ml_integration_test
      ML_TEST_MONGO_DB_NAME: expense_manager_ml_integration_test
      ML_OPERATIONS_TOKEN: ci-test-token-not-for-production
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m pytest tests/ -v

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # npm's classic `npm audit` CLI call hits registry.npmjs.org's
      # quick-audit endpoint (POST /-/npm/v1/security/audits/quick), which
      # is currently degraded/being retired server-side -- verified
      # directly (not assumed): the exact same command run by hand against
      # the real registry returned a mix of indefinite hangs and a
      # `502 Bad Gateway` on that endpoint. That request failure is also
      # what produces the "Invalid package tree, run npm install to
      # rebuild your package-lock.json" text in the failing job's log --
      # that message is npm's generic wording for the audit request
      # itself failing, not necessarily a diagnosis of the lockfile.
      # Checked directly: both backend/package-lock.json and
      # frontend/package-lock.json are already byte-identical to what
      # `npm install` produces locally (confirmed via checksum), so there
      # is no actual lockfile drift to fix here -- the registry endpoint
      # is the real and only cause. A short retry loop is the correct
      # mitigation for a flaky external dependency in a required CI gate:
      # it still fails the job (and therefore blocks the merge) on a real
      # finding at or above --audit-level, it just does not fail solely
      # because npmjs.org's audit endpoint dropped one or two requests.
      - name: Backend dependency audit
        working-directory: backend
        run: |
          attempt=1
          max_attempts=5
          until npm audit --omit=dev --audit-level=critical; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "npm audit failed after $max_attempts attempts."
              exit 1
            fi
            echo "npm audit attempt $attempt/$max_attempts failed (often a transient registry.npmjs.org audit-endpoint issue, not a real finding) -- retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done
      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          attempt=1
          max_attempts=5
          until npm audit --omit=dev --audit-level=critical; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "npm audit failed after $max_attempts attempts."
              exit 1
            fi
            echo "npm audit attempt $attempt/$max_attempts failed (often a transient registry.npmjs.org audit-endpoint issue, not a real finding) -- retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history is needed for the commit-range scan below. On a
      # pull_request event this also gives us the base branch to diff from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # OPS-001-T06 -- pinned release binary rather than a third-party
      # Action: the version is explicit and auditable here, the checksum is
      # verified before anything executes, and there is no licence question
      # about running it on this repository.
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.0
          # sha256 of gitleaks_8.30.0_linux_x64.tar.gz. Regenerate with:
          #   curl -sSL <url> | sha256sum
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --retry 3 --retry-delay 5 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Blocking. Scans every tracked file in the checkout, which is exactly
      # what a fresh clone contains -- so a secret committed by this change
      # fails the build. .env files cannot appear here; they are gitignored.
      - name: Scan the working tree
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-path gitleaks-tree.json

      # Blocking. Catches a secret that was added and then deleted within
      # the same push or pull request -- invisible to the tree scan above,
      # but permanently recoverable from the commit that introduced it.
      - name: Scan the commits introduced by this change
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT" = "push" ] && [ -n "${BEFORE:-}" ] && \
               [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE}..${HEAD_SHA}"
          else
            # A new branch, a tag, or workflow_dispatch: there is no
            # meaningful "before" commit, and the tree scan above already
            # covers the current state. Scanning all of history here would
            # make an unrelated legacy finding block every new branch.
            echo "No incremental commit range for event '$EVENT' -- skipping (tree scan already ran)."
            exit 0
          fi
          echo "Scanning commit range: $range"
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --log-opts "$range" \
            --report-path gitleaks-range.json

      - name: Verify no .env file is tracked
        run: |
          set -euo pipefail
          # A committed .env defeats every other control here. Cheap to
          # check, and unambiguous when it fires.
          if git ls-files --error-unmatch -- '*.env' '.env' >/dev/null 2>&1; then
            echo "::error::A .env file is tracked by git. Remove it from the index and rotate every credential it contained."
            git ls-files -- '*.env' '.env'
            exit 1
          fi
          echo "No tracked .env files."

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: gitleaks-*.json
          if-no-files-found: ignore
          retention-days: 7

  # OPS-001-T07 -- one aggregate check to require in branch protection.
  # Branch protection lists check names as literal strings, so requiring
  # each job individually means editing the repository settings every time
  # a job is added or renamed -- and a job that is added but not required
  # silently protects nothing. Requiring only "CI required checks" keeps
  # that coupling in this file, where it is reviewed with the code.
  #
  # `always()` plus the explicit result test is deliberate: without it a
  # skipped or cancelled dependency would leave this job skipped, and a
  # skipped required check is reported to branch protection as success.
  ci-required:
    name: CI required checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - frontend
      - backend-unit
      - backend-integration
      - e2e
      - deployment-smoke
      - ml
      - dependency-audit
      - secret-scan
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed (results: $RESULTS)."
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
